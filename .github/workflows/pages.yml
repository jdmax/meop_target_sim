name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part-way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # No build step: the page fetches he3_model.py at runtime and runs it in Pyodide
      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html he3_model.py he3_model.js _site/
          # Cache-bust the JS port so a browser never pairs a new page with a stale cached model
          sed -i "s/he3_model\.js?v=dev/he3_model.js?v=${GITHUB_SHA::8}/" _site/index.html
          grep -q "he3_model.js?v=${GITHUB_SHA::8}" _site/index.html
          # Transfer-tube joint stress analysis (static page, results embedded)
          mkdir -p _site/glass_joint
          cp glass_joint/index.html _site/glass_joint/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
